name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -v
      - run: python -m dependency_poc.cli --input data/dependencies.csv --report /tmp/review.csv --map /tmp/map.json
